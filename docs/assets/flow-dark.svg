<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="512" viewBox="0 0 1280 512" role="img" aria-label="How session-namer titles a session in three steps">
  <title>How session-namer titles a session in three steps</title>
  <rect width="1280" height="512" rx="14" fill="#151A23"/>
  <rect x="0.5" y="0.5" width="1279" height="511" rx="14" fill="none" stroke="#2A3240"/>
  <text x="52" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#8A93A6">What happens in one Claude Code session</text>
  <rect x="52" y="72" width="369" height="236" rx="12" fill="#1B212C" stroke="#2A3240"/>
  <circle cx="88" cy="112" r="17" fill="none" stroke="#7D93FF" stroke-width="2"/>
  <text x="88" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#7D93FF">1</text>
  <text x="118" y="119" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#E7EAF0">Session starts</text>
  <text x="76" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#98A1B3">Title becomes the git repo name.</text>
  <text x="76" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#98A1B3">Worktree-aware. No network, &lt;100 ms.</text>
  
  <g transform="rotate(0 126.5 264.5)">
    <path d="M74,253 Q74,250 77,250 L172,250 L179,264.5 L172,279 L77,279 Q74,279 74,276 Z" fill="#2E4BCF" transform="translate(0 2)"/>
    <path d="M74,253 Q74,250 77,250 L172,250 L179,264.5 L172,279 L77,279 Q74,279 74,276 Z" fill="#3E5FF0"/>
    <rect x="78" y="253" width="90" height="2" rx="1" fill="#6680FF" opacity="0.55"/>
    <text x="86" y="270.95" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#1A2C8C" textLength="81" lengthAdjust="spacingAndGlyphs">arcva-2.0</text>
    <text x="86" y="269.75" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#FFFFFF" textLength="81" lengthAdjust="spacingAndGlyphs">arcva-2.0</text>
  </g>
  <path d="M425,207 h26 m-7,-6 l7,6 l-7,6" fill="none" stroke="#7D93FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="455" y="72" width="369" height="236" rx="12" fill="#1B212C" stroke="#2A3240"/>
  <circle cx="491" cy="112" r="17" fill="none" stroke="#7D93FF" stroke-width="2"/>
  <text x="491" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#7D93FF">2</text>
  <text x="521" y="119" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#E7EAF0">First real prompt</text>
  <text x="479" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#98A1B3">A fast model writes a 3 to 7 word</text>
  <text x="479" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#98A1B3">topic in your language, through</text>
  <text x="479" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#98A1B3">your own Claude login.</text>
  
  <g transform="rotate(0 628.5 264.5)">
    <path d="M477,253 Q477,250 480,250 L773,250 L780,264.5 L773,279 L480,279 Q477,279 477,276 Z" fill="#2E4BCF" transform="translate(0 2)"/>
    <path d="M477,253 Q477,250 480,250 L773,250 L780,264.5 L773,279 L480,279 Q477,279 477,276 Z" fill="#3E5FF0"/>
    <rect x="481" y="253" width="288" height="2" rx="1" fill="#6680FF" opacity="0.55"/>
    <text x="489" y="270.95" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#1A2C8C" textLength="279" lengthAdjust="spacingAndGlyphs">arcva-2.0 - Migração de faturas</text>
    <text x="489" y="269.75" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#FFFFFF" textLength="279" lengthAdjust="spacingAndGlyphs">arcva-2.0 - Migração de faturas</text>
  </g>
  <path d="M828,207 h26 m-7,-6 l7,6 l-7,6" fill="none" stroke="#7D93FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="858" y="72" width="369" height="236" rx="12" fill="#1B212C" stroke="#2A3240"/>
  <circle cx="894" cy="112" r="17" fill="none" stroke="#7D93FF" stroke-width="2"/>
  <text x="894" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#7D93FF">3</text>
  <text x="924" y="119" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#E7EAF0">Next two prompts</text>
  <text x="882" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#98A1B3">The title is re-asserted so the</text>
  <text x="882" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#98A1B3">VS Code sidebar cannot drift.</text>
  <text x="882" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#98A1B3">No model call.</text>
  
  <g transform="rotate(0 1031.5 264.5)">
    <path d="M880,253 Q880,250 883,250 L1176,250 L1183,264.5 L1176,279 L883,279 Q880,279 880,276 Z" fill="#2E4BCF" transform="translate(0 2)"/>
    <path d="M880,253 Q880,250 883,250 L1176,250 L1183,264.5 L1176,279 L883,279 Q880,279 880,276 Z" fill="#3E5FF0"/>
    <rect x="884" y="253" width="288" height="2" rx="1" fill="#6680FF" opacity="0.55"/>
    <text x="892" y="270.95" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#1A2C8C" textLength="279" lengthAdjust="spacingAndGlyphs">arcva-2.0 - Migração de faturas</text>
    <text x="892" y="269.75" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#FFFFFF" textLength="279" lengthAdjust="spacingAndGlyphs">arcva-2.0 - Migração de faturas</text>
  </g>
  <rect x="52" y="344" width="6" height="30" rx="3" fill="#F2C230"/>
  <text x="74" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#E7EAF0">Trivial prompts</text>
  <text x="254" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#98A1B3">ok, continua, /resume, bare @file: no model call, title stays as is.</text>
  <rect x="52" y="390" width="6" height="30" rx="3" fill="#F2C230"/>
  <text x="74" y="411" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#E7EAF0">Your title wins</text>
  <text x="254" y="411" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#98A1B3">Renamed with /rename, --name or claude.ai? The plugin never touches it again.</text>
  <rect x="52" y="436" width="6" height="30" rx="3" fill="#F2C230"/>
  <text x="74" y="457" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#E7EAF0">Fails safe</text>
  <text x="254" y="457" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#98A1B3">Timeout or error keeps the project title; at most 3 attempts, one per minute.</text>
</svg>
