<svg xmlns="http://www.w3.org/2000/svg" width="720" height="476" viewBox="0 0 720 476" role="img" aria-label="How session-namer titles a session in three steps">
  <title>How session-namer titles a session in three steps</title>
  <rect width="720" height="476" rx="14" fill="#FBFBF8"/>
  <rect x="0.5" y="0.5" width="719" height="475" rx="14" fill="none" stroke="#E3E5EA"/>
  <text x="40" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#687082">What happens in one Claude Code session</text>
  <rect x="40" y="70" width="640" height="112" rx="12" fill="#FFFFFF" stroke="#E3E5EA"/>
  <circle cx="84" cy="126" r="22" fill="none" stroke="#2346D8" stroke-width="2.5"/>
  <text x="84" y="134" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#2346D8">1</text>
  <text x="126" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#18202E">Session starts</text>
  <text x="126" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#5F6779">Title becomes the git repo name.</text>
  <rect x="40" y="202" width="640" height="112" rx="12" fill="#FFFFFF" stroke="#E3E5EA"/>
  <circle cx="84" cy="258" r="22" fill="none" stroke="#2346D8" stroke-width="2.5"/>
  <text x="84" y="266" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#2346D8">2</text>
  <text x="126" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#18202E">First real prompt</text>
  <text x="126" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#5F6779">A fast model writes a short topic.</text>
  <rect x="40" y="334" width="640" height="112" rx="12" fill="#FFFFFF" stroke="#E3E5EA"/>
  <circle cx="84" cy="390" r="22" fill="none" stroke="#2346D8" stroke-width="2.5"/>
  <text x="84" y="398" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#2346D8">3</text>
  <text x="126" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#18202E">Next two prompts</text>
  <text x="126" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#5F6779">The title is set again, then left alone.</text>
</svg>
