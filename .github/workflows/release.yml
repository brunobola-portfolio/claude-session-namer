name: Release

# verify (tag, manifests, tests) -> npm (when NPM_PUBLISH is on) -> GitHub release.
# The GitHub release goes last so its notes only point at npm once the package is there.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify tag and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Tag matches the version in every manifest and doc
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          node scripts/release.js --check

      - name: Tag points at a commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME is not on main; release from a merged commit"
            exit 1
          }

      - name: Test
        run: node --test

  # Publishes the same tag to npm as `session-namer`, with provenance, through
  # npm trusted publishing (OIDC): no npm token is stored in the repository.
  # Turned on by the repository variable NPM_PUBLISH=true. The secret NPM_TOKEN
  # is only for bootstrapping a package that does not exist on npm yet (npm
  # allows a trusted publisher only on an existing package); delete it after.
  npm:
    name: publish to npm
    needs: verify
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm 11.5.1+, staged publishing npm 12.
      # Pinned, no install scripts, and run before any credential is in the environment.
      - name: Install npm 12.2.2
        run: |
          npm install -g npm@12.2.2 --ignore-scripts
          echo "node $(node -v), npm $(npm -v)"

      # Decides how to publish, failing closed: "oidc" when the package exists,
      # "bootstrap" only on a confirmed 404, "skip" when the version is out.
      - name: Check the registry
        id: registry
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if out="$(npm view "$name@$version" version 2>&1)"; then
            if [ -n "$out" ]; then echo "$name@$version is already on npm"; echo "mode=skip" >> "$GITHUB_OUTPUT"; exit 0; fi
          elif ! grep -q E404 <<<"$out"; then
            echo "::error::npm view failed: $out"; exit 1
          fi
          if npm view "$name" name >/dev/null 2>&1; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          elif grep -q E404 <<<"$(npm view "$name" name 2>&1)"; then
            echo "mode=bootstrap" >> "$GITHUB_OUTPUT"
          else
            echo "::error::could not tell whether $name exists on npm"; exit 1
          fi

      - name: Publish with provenance
        if: steps.registry.outputs.mode != 'skip'
        env:
          # The token is used only to create a package npm does not have yet.
          NODE_AUTH_TOKEN: ${{ steps.registry.outputs.mode == 'bootstrap' && secrets.NPM_TOKEN || '' }}
        run: |
          if [ "${{ steps.registry.outputs.mode }}" = bootstrap ]; then
            if [ -z "$NODE_AUTH_TOKEN" ]; then
              echo "::error::session-namer is not on npm yet, and npm allows a trusted publisher only on an existing package. Add a one-time NPM_TOKEN secret and re-run this job (see CONTRIBUTING.md, Releasing)."
              exit 1
            fi
            # A new package's first version is staged; a maintainer approves it with 2FA.
            npm stage publish --provenance --access public --ignore-scripts
            echo "::notice::Staged with provenance. Approve it with 2FA on npmjs.com (or \`npm stage list\` then \`npm stage approve <id>\`) to publish it."
          else
            npm publish --provenance --access public --ignore-scripts
          fi

  release:
    name: publish GitHub release
    needs: [verify, npm]
    # Runs when npm published or was switched off; a failed npm publish stops it.
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.npm.result == 'success' || needs.npm.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Publish release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          ON_NPM: ${{ needs.npm.result == 'success' }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$ON_NPM" = "true" ]; then
            other="\`npx -y session-namer@$version install --detect\` ([npm](https://www.npmjs.com/package/session-namer/v/$version), published with provenance)"
          else
            other="\`npx -y github:brunobola-portfolio/claude-session-namer#$GITHUB_REF_NAME install --detect\`"
          fi
          node scripts/release.js --notes > notes.md
          cat >> notes.md <<EOF

          **Install.** In Claude Code: \`/plugin marketplace add brunobola-portfolio/claude-session-namer\` then \`/plugin install session-namer@claude-session-namer\` (update with \`/plugin marketplace update claude-session-namer\`).
          Any other agent: $other.
          EOF
          title="$(node scripts/release.js --title)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$title" --notes-file notes.md --verify-tag --latest
          fi
