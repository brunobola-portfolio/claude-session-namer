name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Tag matches the version in every manifest and doc
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          node scripts/release.js --check

      - name: Tag points at a commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME is not on main; release from a merged commit"
            exit 1
          }

      - name: Test
        run: node --test

      - name: Publish release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.js --notes > notes.md
          cat >> notes.md <<EOF

          **Install.** In Claude Code: \`/plugin marketplace add brunobola-portfolio/claude-session-namer\` then \`/plugin install session-namer@claude-session-namer\` (update with \`/plugin marketplace update claude-session-namer\`).
          Any other agent: \`npx -y session-namer@${GITHUB_REF_NAME#v} install --detect\` ([npm](https://www.npmjs.com/package/session-namer/v/${GITHUB_REF_NAME#v}), published with provenance).
          EOF
          title="$(node scripts/release.js --title)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$title" --notes-file notes.md --verify-tag --latest
          fi

  # Publishes the same tag to npm as `session-namer`, with provenance, through
  # npm trusted publishing (OIDC): no npm token is stored in the repository.
  # Turned on by the repository variable NPM_PUBLISH=true. The secret NPM_TOKEN
  # is only for bootstrapping a package that does not exist on npm yet (npm
  # allows a trusted publisher only on an existing package); delete it after.
  npm:
    name: publish to npm
    needs: release
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish session-namer@version (skipped if already on npm)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if ! npm view "$name" name >/dev/null 2>&1 && [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::$name is not on npm yet, and npm allows a trusted publisher only on an existing package. Add a one-time NPM_TOKEN secret and re-run this job (see CONTRIBUTING.md, Releasing)."
            exit 1
          fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm"
          else
            npm install -g "npm@^11.5.1"   # trusted publishing (OIDC) needs npm 11.5.1+
            npm publish --provenance --access public
          fi
