name: Release

# verify (tag, manifests, tests) -> npm (when NPM_PUBLISH is on) -> GitHub release.
# The GitHub release goes last so its notes only point at npm once the package is there.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify tag and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Tag matches the version in every manifest and doc
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          node scripts/release.js --check

      - name: Tag points at a commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME is not on main; release from a merged commit"
            exit 1
          }

      - name: Test
        run: node --test

  # Publishes the same tag to npm as `session-namer`, with provenance, through
  # npm trusted publishing (OIDC): no npm token is stored in the repository.
  # Turned on by the repository variable NPM_PUBLISH=true. The secret NPM_TOKEN
  # is only for bootstrapping a package that does not exist on npm yet (npm
  # allows a trusted publisher only on an existing package); delete it after.
  npm:
    name: publish to npm
    needs: verify
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      # "true" only when the version is installable from npm with verified provenance.
      published: ${{ steps.verify.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm 11.5.1+, staged publishing npm 12.
      # Pinned, no install scripts, and run before any credential is in the environment.
      - name: Install npm 12.2.2
        run: |
          npm install -g npm@12.2.2 --ignore-scripts
          echo "node $(node -v), npm $(npm -v)"

      # Decides how to publish, failing closed: "oidc" when the package exists,
      # "bootstrap" only on a confirmed 404, "skip" when the version is out.
      - name: Check the registry
        id: registry
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if out="$(npm view --prefer-online "$name@$version" version 2>&1)"; then
            if [ -n "$out" ]; then echo "$name@$version is already on npm"; echo "mode=skip" >> "$GITHUB_OUTPUT"; exit 0; fi
          elif ! grep -q E404 <<<"$out"; then
            echo "::error::npm view failed: $out"; exit 1
          fi
          if npm view --prefer-online "$name" name >/dev/null 2>&1; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          elif grep -q E404 <<<"$(npm view --prefer-online "$name" name 2>&1)"; then
            echo "mode=bootstrap" >> "$GITHUB_OUTPUT"
          else
            echo "::error::could not tell whether $name exists on npm"; exit 1
          fi

      - name: Publish with provenance
        id: publish
        if: steps.registry.outputs.mode != 'skip'
        env:
          # The token is used only to create a package npm does not have yet.
          NODE_AUTH_TOKEN: ${{ steps.registry.outputs.mode == 'bootstrap' && secrets.NPM_TOKEN || '' }}
        run: |
          if [ "${{ steps.registry.outputs.mode }}" = bootstrap ]; then
            if [ -z "$NODE_AUTH_TOKEN" ]; then
              echo "::error::session-namer is not on npm yet, and npm allows a trusted publisher only on an existing package. Add a one-time NPM_TOKEN secret and re-run this job (see CONTRIBUTING.md, Releasing)."
              exit 1
            fi
            # A new package's first version is staged; a maintainer approves it with 2FA.
            npm stage publish --provenance --access public --ignore-scripts
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Staged with provenance, not yet installable. Approve it with 2FA on npmjs.com (or \`npm stage list\` then \`npm stage approve <id>\`), then re-run this workflow to publish the GitHub release."
          else
            npm publish --provenance --access public --ignore-scripts
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # Fails the release if the version is not served with its provenance
      # attestation. --prefer-online skips npm's local metadata cache: the
      # registry check above cached the package before this version existed.
      - name: Verify the version is on npm with provenance
        id: verify
        # Also on a re-run that finds the version already published (mode skip).
        if: steps.registry.outputs.mode == 'skip' || steps.publish.outputs.published == 'true'
        run: |
          spec="$(node -p "const p=require('./package.json'); p.name+'@'+p.version")"
          for i in $(seq 1 18); do
            if [ "$(npm view --prefer-online "$spec" dist.attestations.provenance.predicateType 2>/dev/null)" = "https://slsa.dev/provenance/v1" ]; then
              echo "$spec is on npm with SLSA provenance"; exit 0
            fi
            sleep 10
          done
          echo "::error::$spec is not on npm with a provenance attestation"; exit 1

  release:
    name: publish GitHub release
    needs: [verify, npm]
    # Runs when the version is installable from npm, or npm is switched off. A failed
    # publish, or a first version still waiting for approval, holds it back.
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.npm.result == 'skipped' || (needs.npm.result == 'success' && needs.npm.outputs.published == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Publish release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          ON_NPM: ${{ needs.npm.outputs.published == 'true' }}
        run: |
          node scripts/release.js --notes > notes.md
          echo >> notes.md
          if [ "$ON_NPM" = "true" ]; then
            node scripts/release.js --footer --npm >> notes.md
          else
            node scripts/release.js --footer >> notes.md
          fi
          title="$(node scripts/release.js --title)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$title" --notes-file notes.md --verify-tag --latest
          fi
