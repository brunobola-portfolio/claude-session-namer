name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22, 24]
        # Every job takes under a minute; macOS runners are the scarce ones and
        # queued for up to 15 minutes. Node versions are covered on Linux and
        # Windows, so macOS runs the oldest and newest supported Node only.
        exclude:
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Hook contract smoke (fake model result)
        shell: bash
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-cfg
          SESSION_NAMER_FAKE_RESULT: Add pagination to the customers list
          SESSION_NAMER_PROJECT_SOURCE: cwd
        run: |
          out=$(printf '{"session_id":"ci1","cwd":"%s","hook_event_name":"UserPromptSubmit","prompt":"Add pagination to the customers list and write tests"}' "$PWD" | node hooks/namer.js UserPromptSubmit)
          echo "$out"
          echo "$out" | grep -q "\"sessionTitle\":\"$(basename "$PWD") - Add pagination to the customers list\""
      - name: README artwork is up to date
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: |
          node scripts/build-assets.js
          test -z "$(git status --porcelain -- docs/assets)" || { git status --porcelain -- docs/assets; exit 1; }
      - name: npm package ships the runtime and nothing else
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: |
          npm pack --dry-run --json --ignore-scripts > pack.json
          node -e '
            const [p] = require("./pack.json");
            const files = p.files.map((f) => f.path);
            // A second README.* at the root can become the registry readme.
            const extra = files.filter((f) => /^(test|docs|scripts|\.github)\//.test(f) || (/^readme\./i.test(f) && f !== "README.md"));
            const need = ["bin/session-namer.js", "lib/install/index.js", "hooks/namer.js", ".claude-plugin/plugin.json", "README.md", "LICENSE", "CHANGELOG.md"];
            const missing = need.filter((f) => !files.includes(f));
            if (extra.length || missing.length) { console.error({ extra, missing }); process.exit(1); }
            console.log(`${p.name}@${p.version}: ${files.length} files, ${(p.unpackedSize / 1024).toFixed(0)} kB unpacked`);
          '

  # Single stable check name for branch protection, whatever the matrix becomes.
  ci-ok:
    name: ci-ok
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = "success"
